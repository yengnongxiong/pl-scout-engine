# PRD §8.9 recommendation FitScore weights (must sum to 1.0).
components:
  need_fill: 0.40
  role_quality: 0.25
  reliability: 0.15
  style_fit: 0.10
  age_profile: 0.10

# Candidate must beat the incumbent on NeedFill by at least this many percentile points.
upgrade_gate_min_delta: 15

# Peak-age window per position group (AgeProfile). Expert-set starting points.
peak_age:
  CB: [26, 30]
  FB: [24, 28]
  DM: [25, 29]
  CM: [24, 29]
  AM: [24, 28]
  W: [23, 27]
  ST: [24, 29]

# Reliability (0-100) = weighted mean of minutes volume and current availability.
reliability:
  # Effective (blended) minutes at which minutes volume counts as fully reliable.
  full_minutes: 2500
  volume_weight: 0.6
  availability_weight: 0.4
  # FPL status -> availability (0-1): a available, d doubtful, i injured, s suspended,
  # u unavailable (left the club), n not available (e.g. loan terms). FPL's
  # chance_of_playing (0-100), when given, takes precedence for that player.
  status_availability:
    a: 1.0
    d: 0.5
    i: 0.0
    s: 0.0
    u: 0.0
    n: 0.0

# AgeProfile: 100 inside the group's peak_age window, minus this many points per year
# outside it (floored at 0).
age_profile:
  penalty_per_year: 15
