# Engine-wide settings. Every threshold here is referenced by PRD section.
# Environment variables (prefix SCOUT_) override paths; see .env.example.

methodology:
  # PRD §8.2 season blending
  blend_lambda: 0.5
  prev_season_minutes_cap: 2000
  # PRD §8.3 empirical-Bayes shrinkage: default stabilisation constant k (in 90s);
  # per-KPI overrides live in kpis.yaml (`shrinkage_k`).
  default_shrinkage_k: 10.0
  # PRD §8.4 possession adjustment multiplier clip range
  possession_multiplier_min: 0.67
  possession_multiplier_max: 1.5
  # PRD §8.6 percentile peer threshold (blended minutes)
  percentile_min_minutes: 600
  # PRD §8.10 GMM role archetypes
  roles_min_minutes: 900

diagnosis:
  # PRD §8.8
  default_benchmark: top6          # top6 | top4 | league | custom
  weak_link_min_minutes_share: 0.40
  weak_link_max_percentile: 30
  weak_link_min_kpi_weight: 0.20
  depth_single_player_share: 0.80
  depth_backup_min_percentile: 40
  age_risk_min_weighted_age: 30
  contract_risk_months: 12

ingest:
  base_urls:
    fpl: "https://fantasy.premierleague.com/api/"
    # Self-hosted felipeall/transfermarkt-api (run locally; port 8001 avoids the scout API).
    transfermarkt: "http://localhost:8001/"
    # dcaribou/transfermarkt-datasets public export (stale fallback only; updates paused).
    transfermarkt_datasets: "https://pub-e682421888d945d684bcae8890b0ec20.r2.dev/data/"
    vaastav: "https://raw.githubusercontent.com/vaastav/Fantasy-Premier-League/master/data/"
  # FotMob possession shares of a match must sum to 1 within this tolerance.
  possession_sum_tolerance: 0.02
  # transfermarkt-datasets competition id for the Premier League.
  tm_datasets_competition_id: GB1
  # Past seasons pulled from the vaastav archive, counted back from the current season.
  history_seasons_back: 3
  user_agent: "pl-scout-engine/0.1 (personal, non-commercial research project)"
  cache_ttl_hours: 12
  max_retries: 3
  # Exponential backoff between retries (seconds).
  backoff_initial_seconds: 2.0
  backoff_max_seconds: 30.0
  timeout_seconds: 30.0
  # Responses smaller than this, or containing any marker, are anti-bot/interstitial pages
  # and count as failures (CLAUDE.md rule 11; Transfermarkt can return 200/202 with no data).
  min_body_bytes: 64
  interstitial_markers:
    - "captcha"
    - "cf-browser-verification"
    - "Access Denied"
    - "Just a moment..."
  # Requests per second per source (token bucket). Transfermarkt ≤ 1 request / 3 s (PRD §14).
  rate_limits:
    fpl: 1.0
    understat: 0.5
    fotmob: 0.5
    transfermarkt: 0.333
    transfermarkt_datasets: 0.5
    vaastav: 1.0
    statsbomb: 1.0

ml:
  seed: 42
  gmm_k_min: 6
  gmm_k_max: 12

reports:
  # PRD §9 percentile bands (lower bounds, inclusive)
  bands:
    elite: 90
    strong: 75
    above_average: 50
    below_average: 25
