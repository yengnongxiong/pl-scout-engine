name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Test
        run: uv run pytest --cov=scout --cov-report=term
      - name: CLI smoke
        run: uv run scout --help && uv run scout config-check && uv run scout export-openapi --out "$RUNNER_TEMP/openapi.json"

  postgres:
    # Stretch S3: the fixture build must give the same answers on Postgres as on SQLite.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scout
          POSTGRES_PASSWORD: scout
          POSTGRES_DB: scout_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scout -d scout_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCOUT_TEST_POSTGRES_URL: postgresql+psycopg://scout:scout@localhost:5432/scout_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --all-extras --locked
      - name: Postgres parity tests
        run: uv run pytest tests/integration/test_postgres.py -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint and format
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  contract:
    # The web client's types must match the API: export the OpenAPI schema, regenerate the
    # TypeScript types and fail on any drift (CLAUDE.md architecture rules).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: uv sync --all-extras --locked && npm ci --prefix web
      - name: Export OpenAPI and regenerate types
        run: uv run scout export-openapi && npm run gen:api --prefix web
      - name: Fail on drift
        run: git status --porcelain web && git diff --exit-code -- web
